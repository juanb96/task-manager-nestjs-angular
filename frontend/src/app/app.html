<div class="app-shell">
  <app-sidebar [view]="view()" [tasks]="tasks()" (viewChange)="onViewChange($event)" />

  <div class="app-main">
    <app-topbar
      [search]="search()"
      [priorityFilter]="priorityFilter()"
      (newTask)="onNewTask()"
      (searchChange)="onSearchChange($event)"
      (priorityFilterChange)="onPriorityFilterChange($event)"
    />

    @if (error()) {
      <p class="app-error">{{ error() }}</p>
    }

    @if (loading()) {
      <p class="app-loading">Cargando tareas...</p>
    } @else if (view() === 'board') {
      <app-task-board
        [tasks]="visibleTasks()"
        (edit)="onEdit($event)"
        (remove)="onDelete($event)"
        (statusChange)="onStatusChange($event)"
      />
    } @else {
      <app-task-list
        [tasks]="visibleTasks()"
        [statusFilter]="statusFilter()"
        (filterChange)="onStatusFilterChange($event)"
        (edit)="onEdit($event)"
        (remove)="onDelete($event)"
      />
    }
  </div>

  @if (isFormOpen()) {
    <div class="modal-overlay" (click)="onCloseForm()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <app-task-form
          [taskToEdit]="editingTask()"
          (create)="onCreate($event)"
          (save)="onSave($event)"
          (cancelEdit)="onCloseForm()"
        />
      </div>
    </div>
  }
</div>
