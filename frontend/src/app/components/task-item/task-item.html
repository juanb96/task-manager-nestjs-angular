<article class="task-card">
  <header class="task-card__header">
    <h3>{{ task().title }}</h3>
    <span class="badge priority-{{ task().priority }}">{{ priorityLabels[task().priority] }}</span>
  </header>

  @if (task().description) {
    <p class="task-card__description">{{ task().description }}</p>
  }

  <footer class="task-card__footer">
    <div class="task-card__meta">
      <span class="task-card__date">📅 {{ task().createdAt | date: 'dd/MM/yyyy' }}</span>
      @if (showStatus()) {
        <span class="badge status-{{ task().status }}">{{ statusLabels[task().status] }}</span>
      }
    </div>
    <div class="task-card__actions">
      <button type="button" (click)="onEdit()" title="Editar">✎</button>
      <button type="button" class="danger" (click)="onRemove()" title="Eliminar">🗑</button>
    </div>
  </footer>
</article>
